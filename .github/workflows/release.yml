name: Release build

# Builds a signed release APK and publishes it to GitHub Releases.
# The .aab is deliberately never built or published here: anyone holding an
# .aab can upload it to Google Play under their own account.
# when a tag like v1.0.0 is pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}

      - name: Write the signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the upload keystore from repository secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            printf 'storeFile=../release-keystore.jks\n' > keystore.properties
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD" >> keystore.properties
            printf 'keyAlias=%s\n' "$KEY_ALIAS" >> keystore.properties
            printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> keystore.properties
          else
            echo "::warning::No KEYSTORE_BASE64 secret found. Signing with a TEMPORARY key."
            echo "::warning::This artifact is for testing only and cannot be uploaded to Play."
            keytool -genkeypair -v -keystore release-keystore.jks -alias temp-release \
              -keyalg RSA -keysize 2048 -validity 30 \
              -storepass temporary -keypass temporary \
              -dname "CN=Temporary, O=Not for release, C=IN"
            printf 'storeFile=../release-keystore.jks\n' > keystore.properties
            printf 'storePassword=temporary\n' >> keystore.properties
            printf 'keyAlias=temp-release\n' >> keystore.properties
            printf 'keyPassword=temporary\n' >> keystore.properties
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2

      - name: Build signed release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2

      - name: Report artifact sizes
        run: |
          {
            echo "### Release artifact sizes"
            find app/build/outputs -name '*.apk' | while read -r f; do
              echo "- $f : $(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release files
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/release/*.apk release-files/SurakshaSaathi-release.apk
          ( cd release-files && sha256sum * > SHA256SUMS.txt )
          cat release-files/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error


      - name: Publish the APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          body: |
            ## Suraksha Saathi

            **On a phone?** Tap **SurakshaSaathi-release.apk** below. It downloads
            straight to your phone, then open it to install.

            Android will ask you to allow "install unknown apps" for your browser
            or file manager. Allow it, install, then turn that permission back off.
            Step-by-step Hindi instructions are in INSTALL_HINDI.md.

            `SHA256SUMS.txt` lets you check that the file arrived intact.

            Only the APK is published. The `.aab` for Google Play is never
            attached to a public release, so nobody else can upload this app to
            Play under their own account. Build your own when you need it:
            `./gradlew :app:bundleRelease`

            This is a helpful check, not a guarantee. No app can catch every scam.
            यह गारंटी नहीं है।

            Suraksha Saathi is an independent app. It is not a government app and
            is not affiliated with Sanchar Saathi, I4C, any bank, or any authority.
