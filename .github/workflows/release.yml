name: Release build

# Builds a signed release APK and AAB, and publishes the APK to GitHub Releases
# when a tag like v1.0.0 is pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}

      - name: Write the signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the upload keystore from repository secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            printf 'storeFile=../release-keystore.jks\n' > keystore.properties
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD" >> keystore.properties
            printf 'keyAlias=%s\n' "$KEY_ALIAS" >> keystore.properties
            printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> keystore.properties
          else
            echo "::warning::No KEYSTORE_BASE64 secret found. Signing with a TEMPORARY key."
            echo "::warning::This artifact is for testing only and cannot be uploaded to Play."
            keytool -genkeypair -v -keystore release-keystore.jks -alias temp-release \
              -keyalg RSA -keysize 2048 -validity 30 \
              -storepass temporary -keypass temporary \
              -dname "CN=Temporary, O=Not for release, C=IN"
            printf 'storeFile=../release-keystore.jks\n' > keystore.properties
            printf 'storePassword=temporary\n' >> keystore.properties
            printf 'keyAlias=temp-release\n' >> keystore.properties
            printf 'keyPassword=temporary\n' >> keystore.properties
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2

      - name: Build signed release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2

      - name: Build release AAB
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"
        run: ./gradlew :app:bundleRelease --no-daemon --max-workers=2

      - name: Report artifact sizes
        run: |
          {
            echo "### Release artifact sizes"
            find app/build/outputs -name '*.apk' -o -name '*.aab' | while read -r f; do
              echo "- $f : $(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish the APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          body: |
            Suraksha Saathi release build.

            Install it from outside Play by allowing "install unknown apps" for
            your browser or file manager. यह गारंटी नहीं है। This is a helpful
            check, not a guarantee.
